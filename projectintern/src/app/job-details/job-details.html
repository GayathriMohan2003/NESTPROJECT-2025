<div class="job-details-card shadow-sm p-4 mb-4">
  <!-- Back Button -->
  <!-- <button class="btn btn-secondary btn-sm mb-3" (click)="back()">← Back to Jobs</button> -->

  <!-- Job Title -->
  <h2 class="job-title mb-2">{{job.title}}</h2>

  <!-- Company and Category -->
  <p class="company mb-1"><strong>Company:</strong> {{job.company_name}}</p>
  <p class="category mb-2"><strong>Category:</strong> {{job.category}}</p>

  <!-- Type and Location -->
  <p class="type-location mb-2">
    <strong>Type:</strong> {{job.job_type}} | 
    <strong>Location:</strong> {{job.candidate_required_location}}
  </p>

  <!-- Job Description -->
  <div class="description mb-3">
    <h5>Description:</h5>
    <p [innerHTML]="job.description"></p>
  </div>

  <!-- Apply Button -->
  <a [href]="job.url" target="_blank" class="btn btn-primary">Apply Now</a>
</div>
