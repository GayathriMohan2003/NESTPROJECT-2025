<!-- Home Section -->
<div class="home-container">

  <!-- Hero Section -->

    <div class="hero-overlay">
      <h1>Find Your Dream Remote Job</h1>
      <p>Explore top companies, save your favorite jobs, and apply easily from one platform</p>
      <div class="hero-buttons">
        <button class="btn btn-primary" (click)="showJobsList()">View Jobs</button>
        <button class="btn btn-outline-light" (click)="showAbout()">About Us</button>
      </div>
    </div>
  </section>

  <!-- Info Section -->
  <div class="home-info">
    <h2>Why Choose JobPortal?</h2>
    <p>We bring you the latest remote job listings from top companies.  
       Search, save, and apply for jobs easily in one platform.</p>
  </div>

</div>
